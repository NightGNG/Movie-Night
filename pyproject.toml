[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "movie-night"
version = "1.0.0"
description = "Movie Night - The Cosmic Cinema"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Flask==2.3.3",
    "Flask-CORS==4.0.1",
    "discord.py==2.3.2",
    "aiohttp==3.9.1",
    "yt-dlp==2023.12.30",
    "nest-asyncio==1.6.0"
]